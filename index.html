<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>둘의 근무 달력 · 2026</title>
  <style>
    :root {
      --ink: #1d2e35;
      --muted: #748289;
      --line: #e6ece9;
      --canvas: #edf5f1;
      --panel: #ffffff;
      --soft: #f7faf8;
      --teal: #0d9189;
      --teal-deep: #08756f;
      --blue: #377ee8;
      --blue-soft: #eaf2ff;
      --purple: #9062cf;
      --purple-soft: #f4edff;
      --red: #de5a62;
      --red-soft: #fff0f1;
      --yellow: #f9cf55;
      --shadow: 0 18px 48px rgba(43, 82, 68, .10);
      --radius-lg: 24px;
      --radius-md: 16px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: linear-gradient(135deg, #bdd9d0 0%, #e9f3ef 49%, #c8e0d6 100%); }
    button, select, input { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      width: min(1480px, calc(100% - 48px));
      min-height: calc(100vh - 48px);
      margin: 24px auto;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 30px;
      background: rgba(255,255,255,.58);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .rail { display: flex; flex-direction: column; align-items: center; padding: 28px 14px; border-right: 1px solid rgba(13,145,137,.10); }
    .brand { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: white; background: var(--teal); box-shadow: 0 8px 15px rgba(13,145,137,.25); }
    .brand svg { width: 25px; height: 25px; }
    .nav-list { display: grid; gap: 12px; margin-top: 46px; }
    .nav-button { width: 48px; height: 48px; display: grid; place-items: center; border: 0; border-radius: 16px; color: #8a9998; background: transparent; transition: .18s ease; }
    .nav-button:hover, .nav-button.active { color: #1c4f4d; background: #f8d264; }
    .nav-button svg { width: 21px; height: 21px; stroke-width: 1.8; }
    .rail-bottom { margin-top: auto; display: grid; gap: 12px; }

    .content { min-width: 0; padding: 26px 32px 32px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 24px; min-height: 48px; }
    .search { position: relative; width: min(330px, 42vw); }
    .search svg { position: absolute; width: 18px; height: 18px; left: 15px; top: 50%; transform: translateY(-50%); color: #91a09e; }
    .search input { width: 100%; height: 44px; padding: 0 42px; border: 1px solid transparent; border-radius: 14px; outline: none; color: var(--ink); background: rgba(255,255,255,.75); box-shadow: 0 4px 18px rgba(53,92,78,.05); }
    .search input:focus { border-color: #a7d8d0; }
    .top-actions, .identity { display: flex; align-items: center; gap: 12px; }
    .icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 14px; color: #5e7470; background: rgba(255,255,255,.72); }
    .icon-button svg { width: 19px; height: 19px; }
    .identity { position: relative; padding: 5px 8px 5px 5px; border-radius: 16px; background: rgba(255,255,255,.72); font-size: 14px; font-weight: 700; }
    .identity select { width: 90px; padding: 4px 16px 4px 0; border: 0; outline: none; appearance: none; color: var(--ink); background: transparent; font-size: 14px; font-weight: 800; }
    .avatar { display: grid; place-items: center; flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; color: white; font-size: 12px; font-weight: 800; }
    .avatar.dongwan { background: linear-gradient(135deg, #256eaa, #65a6e6); }
    .avatar.seoin { background: linear-gradient(135deg, #8750b5, #c793dc); }
    .chevron { position: absolute; right: 7px; width: 16px; height: 16px; color: #91a09e; pointer-events: none; }

    .main-view, .editor-view { margin-top: 26px; }
    .main-view { display: grid; grid-template-columns: 286px minmax(0, 1fr); gap: 24px; }
    .side-column { display: grid; align-content: start; gap: 18px; }
    .side-card, .calendar-panel, .editor-panel { border-radius: var(--radius-lg); background: rgba(255,255,255,.88); box-shadow: 0 8px 30px rgba(37,84,68,.06); }
    .side-card { padding: 22px; }
    .side-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 17px; font-weight: 800; }
    .side-title button { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 8px; color: #859391; background: transparent; }

    .mini-calendar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .mini-calendar-head strong { font-size: 16px; }
    .mini-nav { display: flex; gap: 5px; }
    .mini-nav button { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 8px; color: #71807d; background: #f4f7f5; }
    .mini-nav svg { width: 15px; height: 15px; }
    .mini-weekdays, .mini-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .mini-weekdays { margin-bottom: 7px; color: #a8b3b1; font-size: 10px; font-weight: 700; }
    .mini-days { row-gap: 4px; }
    .mini-day { display: grid; place-items: center; width: 28px; height: 28px; margin: auto; border: 0; border-radius: 50%; color: #50615f; background: transparent; font-size: 12px; font-weight: 650; }
    .mini-day:hover { background: #e6f3ef; }
    .mini-day.muted { color: #c6cfcc; }
    .mini-day.today { color: white; background: var(--teal); box-shadow: 0 3px 8px rgba(13,145,137,.25); }

    .people { padding: 0; overflow: hidden; }
    .people .side-title { padding: 20px 22px 0; margin-bottom: 10px; }
    .person-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 22px; border: 0; color: var(--ink); text-align: left; background: transparent; }
    .person-row:hover { background: #f6faf8; }
    .person-check { width: 19px; height: 19px; display: grid; place-items: center; margin-left: auto; border: 2px solid #c7d3d0; border-radius: 6px; color: white; }
    .person-row.selected .person-check { border-color: var(--teal); background: var(--teal); }
    .person-check svg { display: none; width: 13px; height: 13px; stroke-width: 3; }
    .person-row.selected .person-check svg { display: block; }
    .person-details { line-height: 1.3; }
    .person-details b { display: block; font-size: 14px; }
    .person-details span { color: var(--muted); font-size: 11px; }

    .legend { display: grid; gap: 12px; }
    .legend-item { display: flex; align-items: center; gap: 9px; color: #596b69; font-size: 13px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot.work { background: var(--blue); }
    .legend-dot.leave { background: var(--purple); }
    .legend-dot.sick { background: var(--red); }

    .calendar-panel { min-width: 0; padding: 26px; }
    .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .month-switcher { display: flex; align-items: center; gap: 12px; }
    .month-switcher h1 { margin: 0; font-size: clamp(22px, 3vw, 29px); letter-spacing: -.04em; }
    .month-switcher button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 10px; color: #70817f; background: #f4f7f5; }
    .month-switcher button:hover { color: var(--teal-deep); background: #e3f2ee; }
    .month-switcher svg { width: 18px; height: 18px; }
    .toolbar-actions { display: flex; align-items: center; gap: 10px; }
    .today-button { height: 38px; padding: 0 13px; border: 1px solid #e3ebe7; border-radius: 11px; color: #536663; background: white; font-size: 13px; font-weight: 700; }
    .primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; color: #254542; background: var(--yellow); box-shadow: 0 5px 12px rgba(230,183,44,.18); font-size: 13px; font-weight: 800; }
    .primary-button:hover { filter: brightness(.98); transform: translateY(-1px); }
    .primary-button svg { width: 17px; height: 17px; stroke-width: 2.5; }
    .calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(90px, 1fr)); }
    .calendar-weekdays { border: 1px solid var(--line); border-bottom: 0; overflow: hidden; border-radius: 14px 14px 0 0; color: #82918f; background: #f8faf9; font-size: 12px; font-weight: 800; text-align: center; }
    .calendar-weekdays div { padding: 13px 5px; border-right: 1px solid var(--line); }
    .calendar-weekdays div:last-child { border-right: 0; }
    .calendar-grid { min-height: 610px; border-left: 1px solid var(--line); }
    .day-cell { position: relative; min-height: 120px; padding: 10px 9px; overflow: hidden; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--ink); background: #fff; transition: background .15s; }
    .day-cell:nth-child(7n+1) { border-left: 0; }
    .day-cell.outside { background: #fbfcfb; }
    .day-cell:hover { background: #f7fcfa; }
    .day-cell:focus-within { outline: 2px solid #96d5ca; outline-offset: -2px; }
    .day-number { display: grid; place-items: center; width: 28px; height: 28px; margin-bottom: 7px; border: 0; border-radius: 50%; color: inherit; background: transparent; font-size: 13px; font-weight: 800; }
    .day-number:hover { background: #ebf5f2; }
    .outside .day-number { color: #b8c2bf; }
    .day-cell.is-today .day-number { color: white; background: var(--teal); box-shadow: 0 4px 8px rgba(13,145,137,.23); }
    .schedule-block { display: flex; align-items: flex-start; gap: 5px; width: 100%; min-height: 27px; margin: 4px 0; padding: 5px 6px; overflow: hidden; border: 0; border-radius: 7px; color: #23413e; text-align: left; background: var(--blue-soft); font-size: 11px; font-weight: 750; line-height: 1.45; }
    .schedule-block:hover { filter: brightness(.98); }
    .schedule-block.work { color: #285da7; background: var(--blue-soft); }
    .schedule-block.leave { color: #7650aa; background: var(--purple-soft); }
    .schedule-block.sick { color: #b7434b; background: var(--red-soft); }
    .schedule-person { display: inline-grid; flex: 0 0 auto; place-items: center; width: 15px; height: 15px; border-radius: 50%; color: white; font-size: 8px; }
    .schedule-person.dongwan { background: #478cd8; }
    .schedule-person.seoin { background: #a976c9; }
    .more-schedules { margin: 4px 0 0 6px; color: #82918f; font-size: 10px; font-weight: 700; }
    .empty-hint { position: absolute; left: 9px; bottom: 9px; opacity: 0; color: #9eadab; font-size: 11px; transition: opacity .15s; }
    .day-cell:hover .empty-hint { opacity: 1; }

    .editor-view { display: none; max-width: 920px; margin-right: auto; margin-left: auto; }
    .editor-view.visible, .main-view.visible { display: grid; }
    .main-view.hidden { display: none; }
    .editor-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .back-button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 3px; border: 0; color: #59716d; background: transparent; font-size: 14px; font-weight: 750; }
    .back-button:hover { color: var(--teal-deep); }
    .back-button svg { width: 18px; height: 18px; }
    .editor-date { color: #607572; font-size: 14px; font-weight: 750; }
    .editor-panel { padding: clamp(24px, 5vw, 44px); }
    .editor-heading { margin-bottom: 30px; }
    .editor-heading p { margin: 0 0 8px; color: var(--teal-deep); font-size: 13px; font-weight: 800; }
    .editor-heading h2 { margin: 0; font-size: clamp(27px, 4vw, 36px); letter-spacing: -.05em; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .form-section { min-width: 0; }
    .form-section.full { grid-column: 1 / -1; }
    .form-label { display: block; margin-bottom: 10px; color: #526966; font-size: 13px; font-weight: 800; }
    .person-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .person-choice { display: flex; align-items: center; gap: 10px; min-height: 55px; padding: 10px; border: 1px solid #e3ebe7; border-radius: 14px; background: #fff; }
    .person-choice.selected { border-color: #63b8aa; background: #f4fbf8; box-shadow: 0 0 0 3px rgba(103,193,177,.11); }
    .person-choice button { padding: 0; border: 0; color: inherit; background: transparent; text-align: left; }
    .person-choice .choice-text { font-size: 13px; font-weight: 800; }
    .person-choice .choice-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 600; }
    .choice-check { display: grid; place-items: center; width: 18px; height: 18px; margin-left: auto; border: 2px solid #c6d4d1; border-radius: 50%; color: white; }
    .person-choice.selected .choice-check { border-color: var(--teal); background: var(--teal); }
    .choice-check svg { display: none; width: 12px; height: 12px; stroke-width: 3; }
    .person-choice.selected .choice-check svg { display: block; }
    .person-choice.locked { cursor: default; }
    .type-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .type-choice { min-height: 96px; padding: 14px; border: 1px solid #e7edeb; border-radius: 14px; color: #60716f; background: #fff; text-align: left; }
    .type-choice:hover { border-color: #badbd5; background: #fbfefd; }
    .type-choice.selected { border-color: currentColor; box-shadow: 0 0 0 3px rgba(78,146,135,.10); }
    .type-choice.work { color: #3979da; }
    .type-choice.leave { color: #9061c8; }
    .type-choice.sick { color: #d4515c; }
    .type-chip { display: block; width: 26px; height: 6px; margin-bottom: 14px; border-radius: 99px; background: currentColor; }
    .type-choice b { display: block; color: var(--ink); font-size: 14px; }
    .type-choice span { display: block; margin-top: 4px; font-size: 11px; font-weight: 650; line-height: 1.4; }
    .detail-area { padding: 18px; border-radius: 16px; background: #f6f9f8; }
    .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .detail-header strong { font-size: 14px; }
    .color-hint { display: inline-flex; align-items: center; gap: 6px; color: #748482; font-size: 11px; font-weight: 700; }
    .color-hint i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
    .option-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .schedule-option { min-height: 67px; padding: 10px; border: 1px solid transparent; border-radius: 12px; color: #496461; background: #fff; text-align: left; }
    .schedule-option:hover { border-color: #cfe2dd; }
    .schedule-option.selected { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(13,145,137,.12); }
    .schedule-option b { display: block; color: var(--ink); font-size: 13px; }
    .schedule-option span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .menstrual-note { display: none; align-items: flex-start; gap: 10px; margin-top: 13px; padding: 12px; border-radius: 12px; color: #a44048; background: var(--red-soft); font-size: 12px; font-weight: 700; line-height: 1.45; }
    .menstrual-note.visible { display: flex; }
    .menstrual-note svg { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 1px; }
    .editor-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--line); }
    .secondary-button { height: 42px; padding: 0 17px; border: 1px solid #e0e9e5; border-radius: 12px; color: #627572; background: white; font-size: 13px; font-weight: 800; }
    .save-button { min-width: 132px; height: 42px; padding: 0 18px; border: 0; border-radius: 12px; color: white; background: var(--teal); box-shadow: 0 5px 13px rgba(13,145,137,.2); font-size: 13px; font-weight: 800; }
    .save-button:hover { background: var(--teal-deep); }
    .toast { position: fixed; right: 28px; bottom: 26px; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 14px 17px; border-radius: 14px; color: white; background: #204b47; box-shadow: 0 12px 28px rgba(22,70,63,.25); font-size: 13px; font-weight: 750; opacity: 0; transform: translateY(16px); pointer-events: none; transition: .22s ease; }
    .toast.visible { opacity: 1; transform: translateY(0); }
    .toast svg { width: 18px; height: 18px; }

    @media (max-width: 1080px) {
      .app-shell { grid-template-columns: 68px minmax(0, 1fr); }
      .rail { padding: 24px 10px; }
      .main-view { grid-template-columns: 238px minmax(0, 1fr); }
      .calendar-panel { padding: 20px; }
      .calendar-grid { grid-template-columns: repeat(7, minmax(74px, 1fr)); }
      .day-cell { min-height: 112px; padding: 8px 6px; }
      .schedule-block { padding: 4px; font-size: 10px; }
    }
    @media (max-width: 820px) {
      .app-shell { width: min(100% - 24px, 720px); margin: 12px auto; grid-template-columns: 1fr; min-height: calc(100vh - 24px); border-radius: 24px; }
      .rail { display: none; }
      .content { padding: 20px; }
      .main-view { grid-template-columns: 1fr; }
      .side-column { grid-template-columns: 1fr 1fr; }
      .side-column .legend-card { grid-column: 1 / -1; }
      .calendar-grid { overflow-x: auto; }
      .topbar { gap: 10px; }
      .identity { padding-right: 5px; }
      .identity select { width: 24px; padding: 0; color: transparent; }
      .chevron { display: none; }
    }
    @media (max-width: 580px) {
      .content { padding: 16px; }
      .topbar { align-items: flex-start; }
      .search { width: 100%; }
      .top-actions .icon-button { display: none; }
      .main-view, .editor-view { margin-top: 18px; }
      .side-column { grid-template-columns: 1fr; }
      .side-column .legend-card { grid-column: auto; }
      .calendar-panel { padding: 14px; border-radius: 18px; }
      .calendar-toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-actions { width: 100%; }
      .toolbar-actions button { flex: 1; }
      .calendar-weekdays, .calendar-grid { grid-template-columns: repeat(7, minmax(58px, 1fr)); }
      .calendar-grid { min-height: 520px; overflow-x: auto; }
      .day-cell { min-height: 94px; padding: 6px 4px; }
      .day-number { margin-bottom: 3px; }
      .schedule-block { display: block; min-height: 21px; max-height: 42px; border-radius: 5px; font-size: 9px; line-height: 1.25; }
      .schedule-person { display: none; }
      .form-grid { grid-template-columns: 1fr; gap: 20px; }
      .type-list, .option-grid { grid-template-columns: 1fr; }
      .type-choice { min-height: 76px; }
      .person-picker { grid-template-columns: 1fr; }
      .editor-panel { padding: 24px 18px; border-radius: 18px; }
      .editor-footer { flex-direction: column-reverse; }
      .editor-footer button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="주 메뉴">
      <div class="brand" aria-label="둘의 달력">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.6 12 3l9 7.6"/><path d="M5.5 9.5v10h13v-10"/><path d="M9 19.5v-5h6v5"/></svg>
      </div>
      <nav class="nav-list">
        <button class="nav-button" id="homeNav" aria-label="홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg></button>
        <button class="nav-button active" id="calendarNav" aria-label="달력" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></button>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <label class="search"><span class="sr-only">일정 검색</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" placeholder="일정 검색" autocomplete="off"></label>
        <div class="top-actions">
          <button class="icon-button" aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
          <label class="identity" for="activePersonSelect"><div class="avatar dongwan" id="topAvatar">동</div><select id="activePersonSelect" aria-label="일정 설정 사용자"><option value="dongwan">임동완</option><option value="seoin">윤서인</option></select><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5"/></svg></label>
        </div>
      </header>

      <section class="main-view visible" id="mainView" aria-label="달력 화면">
        <aside class="side-column">
          <section class="side-card" aria-label="작은 달력">
            <div class="mini-calendar-head"><strong id="miniMonthTitle">2026년 1월</strong><div class="mini-nav"><button id="miniPrev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><button id="miniNext" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div></div>
            <div class="mini-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
            <div class="mini-days" id="miniDays"></div>
          </section>

          <section class="side-card people" aria-label="일정 표시 사용자">
            <div class="side-title"><span>함께 쓰는 달력</span><button aria-label="접기"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5"/></svg></button></div>
            <button class="person-row selected" data-person-filter="dongwan"><div class="avatar dongwan">동</div><span class="person-details"><b>임동완</b><span>Dongwan Lim</span></span><span class="person-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 4 4L19 6"/></svg></span></button>
            <button class="person-row selected" data-person-filter="seoin"><div class="avatar seoin">윤</div><span class="person-details"><b>윤서인</b><span>Seoin Yoon</span></span><span class="person-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 4 4L19 6"/></svg></span></button>
          </section>

          <section class="side-card legend-card" aria-label="일정 색상 안내">
            <div class="side-title"><span>일정 분류</span></div>
            <div class="legend"><div class="legend-item"><i class="legend-dot work"></i>근무</div><div class="legend-item"><i class="legend-dot leave"></i>휴가 · 휴무</div><div class="legend-item"><i class="legend-dot sick"></i>병가</div></div>
          </section>
        </aside>

        <section class="calendar-panel">
          <div class="calendar-toolbar">
            <div class="month-switcher"><button id="prevMonth" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><h1 id="monthTitle">2026년 1월</h1><button id="nextMonth" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div>
            <div class="toolbar-actions"><button class="today-button" id="todayButton">오늘로 이동</button><button class="primary-button" id="createButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>일정 추가</button></div>
          </div>
          <div class="calendar-weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>
      </section>

      <section class="editor-view" id="editorView" aria-label="일정 설정 화면">
        <div class="editor-top"><button class="back-button" id="backButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 12H5M12 19l-7-7 7-7"/></svg>달력으로 돌아가기</button><div class="editor-date" id="editorDate"></div></div>
        <div class="editor-panel">
          <div class="editor-heading"><p>새 일정</p><h2 id="editorHeading">일정을 설정해 주세요</h2></div>
          <div class="form-grid">
            <section class="form-section"><label class="form-label">일정 등록 사용자</label><div class="person-picker" id="personPicker"></div></section>
            <section class="form-section"><label class="form-label">일정 날짜</label><input id="dateInput" type="date" aria-label="일정 날짜" style="width:100%;height:55px;padding:0 14px;border:1px solid #e3ebe7;border-radius:14px;color:#334d49;background:#fff;font-weight:750;outline-color:#82c9bd"></section>
            <section class="form-section full"><label class="form-label">카테고리</label><div class="type-list" id="typeList"><button class="type-choice work selected" data-type="work"><i class="type-chip"></i><b>근무</b><span>교대 근무 시간을 선택해요</span></button><button class="type-choice leave" data-type="leave"><i class="type-chip"></i><b>휴가 · 휴무</b><span>휴가 또는 휴무를 기록해요</span></button><button class="type-choice sick" data-type="sick"><i class="type-chip"></i><b>병가</b><span>생리휴가를 4일로 설정해요</span></button></div></section>
            <section class="form-section full"><div class="detail-area"><div class="detail-header"><strong id="optionHeading">근무 유형</strong><span class="color-hint"><i id="colorDot"></i><span id="colorText">파란색 블록</span></span></div><div class="option-grid" id="optionGrid"></div><div class="menstrual-note" id="menstrualNote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>생리휴가는 선택한 시작일을 포함해 4일간 자동으로 추가됩니다.</span></div></div></section>
          </div>
          <div class="editor-footer"><button class="secondary-button" id="cancelButton">취소</button><button class="save-button" id="saveButton">확인하고 달력으로</button></div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m5 12 4 4L19 6"/></svg><span id="toastText">일정이 저장되었습니다.</span></div>
  <span class="sr-only" id="liveRegion" aria-live="polite"></span>

  <script>
    const icon = (path) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${path}"/></svg>`;
    const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
    const weekdayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    const people = { dongwan: { name: '임동완', initial: '동', klass: 'dongwan', english: 'Dongwan Lim' }, seoin: { name: '윤서인', initial: '윤', klass: 'seoin', english: 'Seoin Yoon' } };
    const categories = {
      work: { title: '근무 유형', colorName: '파란색 블록', items: [{name:'1근', detail:'09:00 – 18:00'}, {name:'2근', detail:'12:00 – 21:00'}, {name:'3근', detail:'14:00 – 23:00'}] },
      leave: { title: '휴가 · 휴무 유형', colorName: '보라색 블록', items: [{name:'반차', detail:'오전 또는 오후'}, {name:'반반차', detail:'2시간 휴무'}, {name:'연차', detail:'하루 휴가'}, {name:'법정휴무', detail:'법정 공휴일'}, {name:'대체휴무', detail:'대체 휴무일'}, {name:'특별휴무', detail:'특별 휴무일'}, {name:'주간휴무', detail:'주간 정기휴무'}] },
      sick: { title: '병가 유형', colorName: '빨간색 블록', items: [{name:'생리휴가', detail:'4일 자동 설정'}] }
    };
    const starterSchedules = [
      { date:'2026-09-02', person:'dongwan', type:'work', name:'1근', detail:'09:00 – 18:00' },
      { date:'2026-09-02', person:'seoin', type:'work', name:'2근', detail:'12:00 – 21:00' },
      { date:'2026-09-05', person:'dongwan', type:'leave', name:'연차', detail:'하루 휴가' },
      { date:'2026-09-07', person:'seoin', type:'work', name:'3근', detail:'14:00 – 23:00' },
      { date:'2026-09-10', person:'dongwan', type:'work', name:'2근', detail:'12:00 – 21:00' },
      { date:'2026-09-12', person:'seoin', type:'leave', name:'주간휴무', detail:'주간 정기휴무' },
      { date:'2026-09-17', person:'dongwan', type:'work', name:'3근', detail:'14:00 – 23:00' },
      { date:'2026-09-20', person:'seoin', type:'leave', name:'반차', detail:'오후' },
      { date:'2026-09-23', person:'dongwan', type:'work', name:'1근', detail:'09:00 – 18:00' },
      { date:'2026-09-25', person:'seoin', type:'sick', name:'생리휴가', detail:'자동 설정' },
      { date:'2026-09-26', person:'seoin', type:'sick', name:'생리휴가', detail:'자동 설정' },
      { date:'2026-09-27', person:'seoin', type:'sick', name:'생리휴가', detail:'자동 설정' },
      { date:'2026-09-28', person:'seoin', type:'sick', name:'생리휴가', detail:'자동 설정' }
    ];
    let schedules = JSON.parse(localStorage.getItem('twoPersonSchedules') || 'null') || starterSchedules;
    const deviceDate = new Date();
    const appToday = new Date(deviceDate.getFullYear(), deviceDate.getMonth(), deviceDate.getDate());
    const todayYMD = formatYMD(appToday);
    let current = new Date(appToday.getFullYear(), appToday.getMonth(), 1);
    let visiblePeople = new Set(['dongwan','seoin']);
    let editingDate = '2026-01-01';
    let activePerson = localStorage.getItem('twoPersonActivePerson') || 'dongwan';
    let chosenPerson = activePerson;
    let chosenType = 'work';
    let chosenOption = '1근';

    const byId = (id) => document.getElementById(id);
    function formatYMD(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
    const parseYMD = (value) => { const [year, month, day] = value.split('-').map(Number); return new Date(year, month - 1, day); };
    const koreanDate = (value) => { const d = parseYMD(value); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${weekdayNames[d.getDay()]}`; };
    const escapeText = (text) => text.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function renderMiniCalendar() {
      byId('miniMonthTitle').textContent = `${current.getFullYear()}년 ${monthNames[current.getMonth()]}`;
      const first = new Date(current.getFullYear(), current.getMonth(), 1);
      const start = new Date(current.getFullYear(), current.getMonth(), 1 - first.getDay());
      let html = '';
      for (let i=0; i<42; i++) {
        const day = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
        const ymd = formatYMD(day);
        const classes = ['mini-day'];
        if (day.getMonth() !== current.getMonth()) classes.push('muted');
        if (ymd === todayYMD) classes.push('today');
        html += `<button class="${classes.join(' ')}" data-date="${ymd}" aria-label="${koreanDate(ymd)}">${day.getDate()}</button>`;
      }
      byId('miniDays').innerHTML = html;
      byId('miniDays').querySelectorAll('button').forEach(button => button.addEventListener('click', () => openEditor(button.dataset.date)));
    }

    function renderCalendar() {
      byId('monthTitle').textContent = `${current.getFullYear()}년 ${monthNames[current.getMonth()]}`;
      const first = new Date(current.getFullYear(), current.getMonth(), 1);
      const start = new Date(current.getFullYear(), current.getMonth(), 1 - first.getDay());
      const query = byId('search').value.trim().toLowerCase();
      let html = '';
      for (let i=0; i<42; i++) {
        const day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const ymd = formatYMD(day);
        const entries = schedules.filter(item => item.date === ymd && visiblePeople.has(item.person) && (!query || `${item.name} ${people[item.person].name} ${item.detail}`.toLowerCase().includes(query)));
        const classes = ['day-cell'];
        if (day.getMonth() !== current.getMonth()) classes.push('outside');
        if (ymd === todayYMD) classes.push('is-today');
        const blocks = entries.slice(0,3).map(item => `<button class="schedule-block ${item.type}" data-date="${ymd}" aria-label="${koreanDate(ymd)}, ${people[item.person].name} ${item.name}"><span class="schedule-person ${people[item.person].klass}">${people[item.person].initial}</span><span>${escapeText(item.name)}</span></button>`).join('');
        const more = entries.length > 3 ? `<div class="more-schedules">+${entries.length-3}개 일정</div>` : '';
        html += `<article class="${classes.join(' ')}"><button class="day-number" data-date="${ymd}" aria-label="${koreanDate(ymd)} 일정 추가">${day.getDate()}</button>${blocks}${more}<span class="empty-hint">+ 일정 추가</span></article>`;
      }
      byId('calendarGrid').innerHTML = html;
      byId('calendarGrid').querySelectorAll('button[data-date]').forEach(button => button.addEventListener('click', () => openEditor(button.dataset.date)));
      renderMiniCalendar();
    }

    function moveMonth(amount) { current = new Date(current.getFullYear(), current.getMonth() + amount, 1); renderCalendar(); }
    function showToast(message) { byId('toastText').textContent = message; byId('toast').classList.add('visible'); setTimeout(() => byId('toast').classList.remove('visible'), 2600); }

    function renderActivePerson() {
      const person = people[activePerson];
      byId('activePersonSelect').value = activePerson;
      byId('topAvatar').className = `avatar ${person.klass}`;
      byId('topAvatar').textContent = person.initial;
    }

    function renderEditor() {
      byId('editorDate').textContent = koreanDate(editingDate);
      byId('editorHeading').textContent = `${people[activePerson].name}님의 ${parseYMD(editingDate).getMonth()+1}월 ${parseYMD(editingDate).getDate()}일 일정을 설정해 주세요`;
      byId('dateInput').value = editingDate;
      const person = people[activePerson];
      byId('personPicker').innerHTML = `<div class="person-choice selected locked" aria-label="상단 사용자 ${person.name}에게만 일정이 등록됩니다."><span class="avatar ${person.klass}">${person.initial}</span><span class="choice-text">${person.name}<small class="choice-sub">상단 사용자 설정에 따라 자동 적용</small></span><span class="choice-check">${icon('m5 12 4 4L19 6')}</span></div>`;
      byId('typeList').querySelectorAll('button').forEach(button => button.classList.toggle('selected', button.dataset.type === chosenType));
      const data = categories[chosenType];
      byId('optionHeading').textContent = data.title;
      byId('colorText').textContent = data.colorName;
      byId('colorDot').style.background = chosenType === 'work' ? 'var(--blue)' : chosenType === 'leave' ? 'var(--purple)' : 'var(--red)';
      byId('optionGrid').innerHTML = data.items.map(item => `<button class="schedule-option ${item.name === chosenOption ? 'selected' : ''}" data-option="${item.name}"><b>${item.name}</b><span>${item.detail}</span></button>`).join('');
      byId('optionGrid').querySelectorAll('button').forEach(button => button.addEventListener('click', () => { chosenOption = button.dataset.option; renderEditor(); }));
      byId('menstrualNote').classList.toggle('visible', chosenType === 'sick' && chosenOption === '생리휴가');
    }

    function openEditor(date) {
      editingDate = date;
      chosenPerson = activePerson;
      chosenType = 'work';
      chosenOption = '1근';
      byId('mainView').classList.remove('visible');
      byId('mainView').classList.add('hidden');
      byId('editorView').classList.add('visible');
      renderEditor();
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
    function showCalendar() {
      byId('editorView').classList.remove('visible');
      byId('mainView').classList.remove('hidden');
      byId('mainView').classList.add('visible');
      byId('homeNav').classList.remove('active');
      byId('calendarNav').classList.add('active');
      byId('calendarNav').setAttribute('aria-current', 'page');
      renderCalendar();
    }
    function closeEditor() { showCalendar(); }
    function saveSchedule() {
      editingDate = byId('dateInput').value || editingDate;
      chosenPerson = activePerson;
      const option = categories[chosenType].items.find(item => item.name === chosenOption);
      const days = chosenType === 'sick' && chosenOption === '생리휴가' ? 4 : 1;
      for (let offset=0; offset<days; offset++) {
        const date = parseYMD(editingDate);
        date.setDate(date.getDate() + offset);
        const day = formatYMD(date);
        schedules = schedules.filter(item => !(item.date === day && item.person === chosenPerson && item.name === chosenOption));
        schedules.push({ date: day, person: chosenPerson, type: chosenType, name: chosenOption, detail: option.detail });
      }
      localStorage.setItem('twoPersonSchedules', JSON.stringify(schedules));
      const savedLabel = days === 4 ? '생리휴가 4일이 달력에 저장되었습니다.' : `${chosenOption} 일정이 달력에 저장되었습니다.`;
      current = new Date(parseYMD(editingDate).getFullYear(), parseYMD(editingDate).getMonth(), 1);
      closeEditor();
      showToast(savedLabel);
      byId('liveRegion').textContent = savedLabel;
    }

    byId('prevMonth').addEventListener('click', () => moveMonth(-1));
    byId('nextMonth').addEventListener('click', () => moveMonth(1));
    byId('miniPrev').addEventListener('click', () => moveMonth(-1));
    byId('miniNext').addEventListener('click', () => moveMonth(1));
    byId('todayButton').addEventListener('click', () => { current = new Date(appToday.getFullYear(), appToday.getMonth(), 1); renderCalendar(); });
    byId('createButton').addEventListener('click', () => openEditor(todayYMD));
    byId('homeNav').addEventListener('click', () => { current = new Date(appToday.getFullYear(), appToday.getMonth(), 1); showCalendar(); });
    byId('calendarNav').addEventListener('click', showCalendar);
    byId('backButton').addEventListener('click', closeEditor);
    byId('cancelButton').addEventListener('click', closeEditor);
    byId('saveButton').addEventListener('click', saveSchedule);
    byId('dateInput').addEventListener('change', event => { editingDate = event.target.value; renderEditor(); });
    byId('typeList').querySelectorAll('button').forEach(button => button.addEventListener('click', () => { chosenType = button.dataset.type; chosenOption = categories[chosenType].items[0].name; renderEditor(); }));
    byId('search').addEventListener('input', renderCalendar);
    byId('activePersonSelect').addEventListener('change', event => { activePerson = event.target.value; chosenPerson = activePerson; localStorage.setItem('twoPersonActivePerson', activePerson); renderActivePerson(); showToast(`${people[activePerson].name}님의 일정만 새로 등록됩니다.`); });
    document.querySelectorAll('.person-row').forEach(button => button.addEventListener('click', () => { const person = button.dataset.personFilter; visiblePeople.has(person) ? visiblePeople.delete(person) : visiblePeople.add(person); button.classList.toggle('selected', visiblePeople.has(person)); renderCalendar(); }));
    renderActivePerson();
    renderCalendar();
  </script>
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</body>
</html>
